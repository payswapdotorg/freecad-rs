[workspace]
resolver = "2"
members = [
    "crates/fc-base",
    "crates/fc-app",
    "crates/fc-part",
    "crates/fc-io",
    "crates/fc-sketcher",
    "crates/fc-script",
    "crates/fc-viewer",
    "crates/fc-step",
    "crates/freecad-rs",
    "crates/fc-wasm",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/payswapdotorg/freecad-rs"
rust-version = "1.75"

[workspace.dependencies]
fc-base = { path = "crates/fc-base" }
fc-app = { path = "crates/fc-app" }
fc-part = { path = "crates/fc-part" }
fc-io = { path = "crates/fc-io" }
fc-sketcher = { path = "crates/fc-sketcher" }
fc-script = { path = "crates/fc-script" }
fc-viewer = { path = "crates/fc-viewer" }
fc-step = { path = "crates/fc-step" }
rhai = "1.26"
# .FCStd archives are zip with deflate/stored entries (FreeCAD's own
# writer) — the default feature set's C codecs (bzip2/lzma/zstd) never
# appear in the format and break the wasm32 build.
zip = { version = "2.2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
