name: CI
on:
  push:
    branches: [main, "work/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Format
        run: cargo fmt --all -- --check

  studio:
    # The browser workbench asset: build the wasm engine, package the
    # self-contained HTML, and sanity-check the embed marker + the
    # packaged size (the release ships exactly this file).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build engine (wasm32) + package the workbench
        run: scripts/package-studio.sh
      - name: Sanity checks
        run: |
          grep -q "fc-wasm-embed" studio/fc-studio.html
          grep -q "__FC_WASM_B64" dist/fc-studio.html
          test "$(wc -c < dist/fc-studio.html)" -gt 2000000
          test "$(wc -c < dist/fc_wasm.wasm)" -gt 1000000
          echo "fc-studio.html: $(wc -c < dist/fc-studio.html) bytes, fc_wasm.wasm: $(wc -c < dist/fc_wasm.wasm) bytes"

  viewer:
    # M1: the GPU render tests on a software adapter (lavapipe). The
    # golden image for the ISO frame is blessed here and uploaded as an
    # artifact — the committed golden is regenerated, never hand-edited.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install lavapipe (software Vulkan)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Build workspace
        run: cargo build --workspace --locked
      - name: Build interactive feature
        run: cargo build -p fc-viewer --features interactive --locked
      # First run: no committed golden exists yet — bless it (the TL then
      # commits the artifact, and every later run is strict: the
      # golden-diff test fails on missing or drifted goldens).
      - name: Bootstrap golden when absent
        run: |
          if [ ! -f crates/fc-viewer/tests/goldens/demo-iso.png ]; then
            echo "golden absent — blessing (commit the artifact to make future runs strict)"
            FC_VIEWER_GPU=1 cargo run -p freecad-rs --locked -- render examples/demo.fcstd /tmp/demo-iso.png --bless
          else
            echo "golden present — strict test run"
          fi
      - name: GPU tests (lavapipe)
        run: FC_VIEWER_GPU=1 cargo test -p fc-viewer --locked
      - name: Bless golden render
        if: always()
        run: FC_VIEWER_GPU=1 cargo run -p freecad-rs --locked -- render examples/demo.fcstd /tmp/demo-iso.png --bless
      - name: Upload golden artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-demo-iso
          path: crates/fc-viewer/tests/goldens/demo-iso.png
          if-no-files-found: error
